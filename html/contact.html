<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | OPO Adota</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <header>
    <div class="navbar">
      <div class="logo">OPO <span>Adota</span></div>
      <nav>
        <ul>
          <li><a href="../index.html">Início</a></li>
          <li><a href="aboutus.html">Sobre a gente</a></li>
          <li><a href="contact.html" class="ativo">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section>
      <h1>Contacto</h1>
      <p>Entre em contacto connosco preenchendo o formulário abaixo:</p>
    </section>

    <section>
      <form action="#" method="POST">
        <div style="margin-bottom: 1rem;">
          <label for="nome" style="display: block; margin-bottom: 0.3rem; font-weight: 600;">Nome:</label>
          <input type="text" id="nome" name="nome" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1rem;">
          <label for="email" style="display: block; margin-bottom: 0.3rem; font-weight: 600;">E-mail:</label>
          <input type="email" id="email" name="email" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>

        <div style="margin-bottom: 1rem;">
          <label for="mensagem" style="display: block; margin-bottom: 0.3rem; font-weight: 600;">Mensagem:</label>
          <textarea id="mensagem" name="mensagem" rows="4" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;"></textarea>
        </div>

        <button type="submit" style="background-color: var(--verde); color: var(--branco); border: none; padding: 0.7rem 1.5rem; font-weight: 700; border-radius: 4px; cursor: pointer;">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 OPO Adota</p>
  </footer>

  <script src="../js/main.js" defer></script>

</body>
</html>
